[package]
name = "freightdock-network"
description = "Freightdock's network-agent: makes a cluster node's overlay what the managers say it should be."
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/freightdock/Network"
rust-version = "1.90"

[dependencies]
anyhow = "1"
base64 = "0.22"
freightdock-proto = { path = "../Freightdock-Contracts" }
rand_core = { version = "0.6", features = ["getrandom"] }
tracing = "0.1"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
tempfile = "3"
